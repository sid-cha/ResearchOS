spring:
  application:
    name: research-os-api
  datasource:
    url: jdbc:postgresql://localhost:5432/researchos
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true

researchos:
  api:
    provider: fmp
    base-url: https://financialmodelingprep.com/api/v3
    key: ${FMP_API_KEY:}
